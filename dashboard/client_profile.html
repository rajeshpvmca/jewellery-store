<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patron Profile | Maison Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="dash-subpage">

    <div class="subpage-header">
        <div>
            <h1 class="subpage-title">Patron Profile &amp; Haute Preferences</h1>
            <p class="subpage-subtitle">Your private ring dimensions, precious metal preferences, and insured security credentials.</p>
        </div>
        <span class="badge-gold"><i class="fa-solid fa-crown me-1"></i> Sovereign Tier 1 Patron</span>
    </div>

    <form onsubmit="event.preventDefault(); alert('Patron profile and bespoke preferences successfully saved.');">
        <div class="row g-4">
            <!-- Left: Personal & VIP Credentials -->
            <div class="col-12 col-lg-6">
                <div class="dash-panel-card mb-4">
                    <div class="dash-panel-header">
                        <h3 class="dash-panel-title"><i class="fa-solid fa-id-card-clip text-gold"></i> Personal Credentials</h3>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label-gold">Honorific / Title</label>
                            <input type="text" class="form-control form-control-luxury" value="Lord / Patron" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Full Name</label>
                            <input type="text" class="form-control form-control-luxury" value="Alexander Vance" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label-gold">Official Registered Email</label>
                            <input type="email" class="form-control form-control-luxury" value="patron@stacklyjewellers.com" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Concierge Direct Phone</label>
                            <input type="tel" class="form-control form-control-luxury" value="+91 9876543210" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Patron Identification Code</label>
                            <input type="text" class="form-control form-control-luxury" value="PATRON-LON-7702" disabled>
                        </div>
                    </div>
                </div>

                <div class="dash-panel-card">
                    <div class="dash-panel-header">
                        <h3 class="dash-panel-title"><i class="fa-solid fa-shield-halved text-gold"></i> Armored Delivery &amp; Security</h3>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-gold">Primary Vault / Armored Delivery Address</label>
                        <textarea class="form-control form-control-luxury" rows="2" required>45 New Bond Street, Private Penthouse Suite, Mayfair, London W1S 2SF, United Kingdom</textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label-gold">Courier Authentication Phrase</label>
                            <input type="password" class="form-control form-control-luxury" value="********" placeholder="Passphrase for armed delivery">
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">2FA Vault Security</label>
                            <select class="form-select form-control-luxury">
                                <option selected>Biometric / SMS Enabled</option>
                                <option>Hardware Token</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Sizing & Haute Joaillerie Specifications -->
            <div class="col-12 col-lg-6">
                <div class="dash-panel-card mb-4">
                    <div class="dash-panel-header">
                        <h3 class="dash-panel-title"><i class="fa-solid fa-ruler-combined text-gold"></i> Bespoke Dimensions &amp; Sizing</h3>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label-gold">Ring Size (British Standard)</label>
                            <select class="form-select form-control-luxury">
                                <option>Size K (50.2mm)</option>
                                <option selected>Size L 1/2 (51.9mm - US 6)</option>
                                <option>Size M (52.5mm)</option>
                                <option>Size N (53.8mm)</option>
                                <option>Size P (56.3mm)</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Wrist Circumference</label>
                            <input type="text" class="form-control form-control-luxury" value="16.5 cm (6.5 inches)">
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Necklace Standard Length</label>
                            <select class="form-select form-control-luxury">
                                <option>Choker (16 inches / 40cm)</option>
                                <option selected>Princess (18 inches / 45cm)</option>
                                <option>Matinee (20 inches / 50cm)</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label-gold">Earring Setting Style</label>
                            <select class="form-select form-control-luxury">
                                <option selected>La Pousette / Guardian Backs</option>
                                <option>Screw Backs</option>
                                <option>Omega Clip Backs</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="dash-panel-card">
                    <div class="dash-panel-header">
                        <h3 class="dash-panel-title"><i class="fa-solid fa-gem text-gold"></i> Precious Metal &amp; Gem Preferences</h3>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-gold">Preferred Precious Metals</label>
                        <div class="d-flex flex-wrap gap-2">
                            <div class="form-check me-2">
                                <input class="form-check-input" type="checkbox" id="m1" checked>
                                <label class="form-check-label text-white small" for="m1">950 Solid Platinum</label>
                            </div>
                            <div class="form-check me-2">
                                <input class="form-check-input" type="checkbox" id="m2" checked>
                                <label class="form-check-label text-white small" for="m2">18K Mayfair Yellow Gold</label>
                            </div>
                            <div class="form-check me-2">
                                <input class="form-check-input" type="checkbox" id="m3">
                                <label class="form-check-label text-white small" for="m3">18K Crown Rose Gold</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-gold">Favorite Gemstone Specialties</label>
                        <input type="text" class="form-control form-control-luxury" value="Type IIa Natural Diamonds, Ceylon Sapphires, Muzo Emeralds">
                    </div>
                    <button type="submit" class="btn-gold-sm w-100 py-2 mt-2">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Haute Preferences
                    </button>
                </div>
            </div>
        </div>
    </form>

</body>
</html>
